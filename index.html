<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Projset: BST & AVL Visualizer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Projset: BST & AVL Visualizer</h1>
  </header>
  <main>
    <section id="controls">
      <label for="mode">Mode:</label>
      <select id="mode">
        <option value="bst">BST (Binary Search Tree)</option>
        <option value="avl">AVL (Self-balancing)</option>
      </select>

      <input id="value" type="number" placeholder="value" />
      <button id="insert">Insert</button>
      <button id="remove">Delete</button>
      <button id="search">Search</button>
      <button id="clear">Clear</button>
    </section>

    <section id="visual">
      <svg id="svg" width="100%" height="600"></svg>
    </section>

    <section id="log"><strong>Log:</strong><div id="logInner"></div></section>
  </main>

  <footer>
    <small>Open index.html in a browser. Built with Copilot CLI runtime in VS Code.</small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
